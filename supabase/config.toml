# Configuração do Supabase para a plataforma.
# A função de análise exige usuário autenticado (verify_jwt), para que ninguém
# com a URL gaste tokens da Anthropic.

[functions.analisar-contrato]
verify_jwt = true

[functions.monitor-legislacao]
verify_jwt = true

# Robôs chamados pelo horário automático do banco (pg_cron) com o cabeçalho x-cron-secret, sem login.
# Cada função confere sozinha: usuário logado OU segredo do horário (configuracoes.cron_segredo).
[functions.prazos-automaticos]
verify_jwt = false

[functions.pecas-automaticas]
verify_jwt = false

# Passo C2: ingestão do GDELT na ontologia de eventos. Chamada pelo pg_cron com x-cron-secret;
# sem o segredo responde 401, para ninguém disparar coleta anonimamente.
[functions.gdelt-coleta]
verify_jwt = false

# Passo C3: água (ANA/SAR). Mesma regra do gdelt-coleta: chamada pelo pg_cron com x-cron-secret,
# sem login. Com verify_jwt=true (o padrão de quem esqueceu de marcar aqui) o próprio portão da
# Edge Function devolvia 401 antes do código rodar, e a coleta diária nunca escreveu nada — foi
# isso que fez C3 ficar em zero eventos até 14/11/2026, mesmo com o cron marcando "succeeded".
[functions.ana-agua]
verify_jwt = false
