# Configuração do Supabase para a plataforma.
# A função de análise exige usuário autenticado (verify_jwt), para que ninguém
# com a URL gaste tokens da Anthropic.

[functions.analisar-contrato]
verify_jwt = true

[functions.monitor-legislacao]
verify_jwt = true

# Robôs chamados pelo horário automático do banco (pg_cron) com o cabeçalho x-cron-secret, sem login.
# Cada função confere sozinha: usuário logado OU segredo do horário (configuracoes.cron_segredo).
[functions.prazos-automaticos]
verify_jwt = false

[functions.pecas-automaticas]
verify_jwt = false
