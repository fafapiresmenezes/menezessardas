# Botão único de publicar (Actions → "Publicar a plataforma" → Run workflow).
# Faz três coisas, nesta ordem, com as chaves guardadas em Settings → Secrets and variables → Actions:
#   1. Testa e monta o site e publica num endereço NOVO da Vercel (projeto "theye-suporte-juridico"),
#      sem tocar no site antigo gmenezes-advogados.vercel.app (que tem telas que não estão no GitHub).
#   2. Instala no Supabase as funções do CNJ: fontes-oficiais, intimacoes, prazos-automaticos e pecas-automaticas.
#   3. (Opcional) Atualiza o banco com as migrações escolhidas (padrão: 114, robô de prazos e peças).
# Chaves necessárias: VERCEL_TOKEN (vercel.com/account/tokens) e SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).
name: Publicar a plataforma
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Publicar o site novo na Vercel'
        type: boolean
        default: true
      funcoes:
        description: 'Instalar as funções do CNJ no Supabase'
        type: boolean
        default: true
      migracoes:
        description: 'Migrações do banco a aplicar, separadas por espaço (ex.: 114 ou 111 113 114). Vazio = não mexe no banco.'
        type: string
        default: '114'
permissions:
  contents: read
concurrency:
  group: publicar
  cancel-in-progress: false
env:
  SUPABASE_REF: hlraekzvgxdpiiigdxdo
  VERCEL_ESCOPO: still12
  VERCEL_PROJETO: theye-suporte-juridico
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Conferir as chaves
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          falta=""
          if [ "${{ inputs.site }}" = "true" ] && [ -z "$VERCEL_TOKEN" ]; then falta="$falta VERCEL_TOKEN"; fi
          if { [ "${{ inputs.funcoes }}" = "true" ] || [ -n "${{ inputs.migracoes }}" ]; } && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then falta="$falta SUPABASE_ACCESS_TOKEN"; fi
          if [ -n "$falta" ]; then
            echo "::error::Falta cadastrar em Settings → Secrets and variables → Actions:$falta"
            exit 1
          fi

      - name: Testes (nada sobe se algum teste falhar)
        run: |
          npx tsc --noEmit -p .
          npx vitest run

      # 3. Banco primeiro: as funções e o site novo dependem das tabelas da 114.
      - name: Atualizar o banco
        if: ${{ inputs.migracoes != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIGRACOES: ${{ inputs.migracoes }}
        run: |
          for n in $MIGRACOES; do
            arq=$(ls database/migrations/${n}_*.sql 2>/dev/null | head -1)
            if [ -z "$arq" ]; then echo "::error::Migração $n não encontrada"; exit 1; fi
            echo "Aplicando $arq"
            jq -Rs '{query: .}' "$arq" > /tmp/corpo.json
            codigo=$(curl -sS -o /tmp/resposta.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data @/tmp/corpo.json)
            if [ "$codigo" -ge 300 ]; then echo "::error::Migração $n falhou ($codigo)"; cat /tmp/resposta.json; exit 1; fi
            echo "Migração $n aplicada."
          done

      - name: Instalar as funções do CNJ
        if: ${{ inputs.funcoes }}
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: ${{ inputs.funcoes }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/gerar-juridico-funcoes.mjs
          supabase functions deploy fontes-oficiais --project-ref "$SUPABASE_REF" --use-api
          supabase functions deploy intimacoes --project-ref "$SUPABASE_REF" --use-api
          # Os dois robôs são chamados pelo horário automático do banco (cabeçalho x-cron-secret), sem login;
          # cada função confere sozinha o login ou o segredo do horário.
          supabase functions deploy prazos-automaticos --project-ref "$SUPABASE_REF" --no-verify-jwt --use-api
          supabase functions deploy pecas-automaticas --project-ref "$SUPABASE_REF" --no-verify-jwt --use-api

      - name: Montar e publicar o site novo
        if: ${{ inputs.site }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Chaves públicas (as mesmas que o navegador já recebe); a segurança está nas regras do banco.
          VITE_SUPABASE_URL: https://hlraekzvgxdpiiigdxdo.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhscmFla3p2Z3hkcGlpaWdkeGRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODEzOTksImV4cCI6MjEwODQ1NzM5OX0.yCNPEGDb7tdf1JIY30WKUbE-xZwjQFwygJFJnvBeyrs
        run: |
          npm run build
          # A pasta tem o nome do projeto: na primeira vez a Vercel cria o projeto com esse nome; depois reaproveita.
          rm -rf "/tmp/$VERCEL_PROJETO" && cp -r dist "/tmp/$VERCEL_PROJETO"
          cd "/tmp/$VERCEL_PROJETO"
          url=$(npx --yes vercel@39.1.0 deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ESCOPO")
          echo "Site publicado: $url"
          echo "### Site publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Endereço fixo: https://$VERCEL_PROJETO.vercel.app (esta versão: $url)" >> "$GITHUB_STEP_SUMMARY"
