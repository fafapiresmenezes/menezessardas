# R8: monta o aplicativo "THEYE Geo" (APK) para M instalar direto no celular, sem loja.
#
# POR QUE ESTE FLUXO EXISTE: o contêiner de desenvolvimento não alcança dl.google.com, de onde
# vêm o SDK do Android e o plugin do Gradle (o proxy de saída recusa). O runner do GitHub já vem
# com o SDK instalado, então a montagem acontece aqui. O APK sai como "artefato" do fluxo, que M
# baixa pela página do GitHub.
#
# ASSINATURA: é um APK de depuração, assinado com a chave de depuração padrão do Android, que
# serve para instalar no próprio aparelho. NENHUMA credencial de assinatura entra no repositório.
# Loja só no R12, e só com o OK de M.
name: "THEYE Geo: montar o APK"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/pages/GeolocalizacaoPage.tsx'
      - 'src/lib/geo/**'
      - 'src/components/geo/**'
      - 'scripts/geo/conferir-apk.mjs'
      - '.github/workflows/geo-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/pages/GeolocalizacaoPage.tsx'
      - 'src/lib/geo/**'
      - 'src/components/geo/**'
      - 'scripts/geo/conferir-apk.mjs'
      - '.github/workflows/geo-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # O contexto `secrets` NAO funciona dentro de `if:` de passo; funciona aqui, e o `if` le
      # daqui. Escrito direto no `if`, a condicao seria sempre falsa e os passos da versao de
      # publicacao nunca rodariam, sem erro nenhum aparecer.
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # O runner do GitHub já traz o SDK do Android instalado. Só pedimos as peças
      # que a montagem usa (API 35). O pacote antigo "tools", que esta ação instala
      # por padrão, não existe mais no repositório da Google e derrubava o fluxo.
      - name: Preparar o SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar as dependências
        run: npm ci

      - name: Provar que o geo continua passando
        run: npx vitest run src/lib/geo src/components/geo src/pages/geo

      - name: Montar o site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Copiar o site para dentro do app
        run: npx cap sync android

      - name: Montar o APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      # A prova que importa: o manifesto COMPILADO dentro do APK, lido com o aapt2. O teste
      # de unidade lê o nosso arquivo-fonte; o merge do Gradle e os manifestos dos plugins do
      # Capacitor podem acrescentar permissão ou religar a cópia para a nuvem sem tocar nele.
      # Se qualquer promessa do app estiver quebrada no arquivo que vai para o celular, a obra
      # para aqui e o APK NÃO é guardado para baixar.
      - name: Conferir o APK montado
        run: node scripts/geo/conferir-apk.mjs android/app/build/outputs/apk/debug/app-debug.apk debug

      - name: Guardar o APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: theye-geo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---- Versao de PUBLICACAO, so quando a chave de assinatura existir nos segredos ----
      # Enquanto o segredo ANDROID_KEYSTORE_BASE64 nao existir, estes passos sao pulados e o
      # fluxo termina exatamente como antes. Quando existir, sai um APK de publicacao assinado e
      # nao depuravel, e a MESMA conferencia roda sobre ele exigindo que nao seja depuravel.
      # E o que falta para a dimensao 4 da regua chegar a 10. Criar a chave e de graca; o passo
      # a passo esta em /mnt/project-files/geo-replano/PASSO-A-PASSO-M-geo.md.
      - name: Recompor a chave de assinatura a partir do segredo
        if: env.TEM_CHAVE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/theye.jks"
          test -s "$RUNNER_TEMP/theye.jks"

      - name: Montar o APK de publicacao, assinado
        if: env.TEM_CHAVE == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/theye.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
        working-directory: android

      - name: Conferir o APK de publicacao
        if: env.TEM_CHAVE == 'true'
        run: node scripts/geo/conferir-apk.mjs android/app/build/outputs/apk/release/app-release.apk release

      - name: Guardar o APK de publicacao
        if: env.TEM_CHAVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: theye-geo-apk-publicacao
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Dizer, no log, que a chave ainda nao existe
        if: env.TEM_CHAVE != 'true'
        run: |
          echo "So o APK de DEPURACAO foi montado."
          echo "A versao de publicacao exige a chave de assinatura nos segredos do repositorio:"
          echo "ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e"
          echo "ANDROID_KEY_PASSWORD. Criar a chave e de graca, e o passo a passo esta em"
          echo "/mnt/project-files/geo-replano/PASSO-A-PASSO-M-geo.md."
          echo "Enquanto isso a dimensao 4 da regua fica em 9, e nao em 10."

