# Botão para instalar UMA função do Instituto no Supabase e, se quiser, rodar a coleta dela.
# Actions → "Função do Instituto" → Run workflow.
#
# POR QUE ESTE FLUXO EXISTE: o contêiner de desenvolvimento não alcança as fontes públicas
# (sar.ana.gov.br, data.gdeltproject.org e companhia: o proxy de saída recusa), e o segredo do
# agendador não pode sair do servidor. Aqui a função é instalada a partir do próprio repositório e
# chamada de dentro do GitHub, com o segredo lido na hora e nunca impresso no registro.
name: Função do Instituto
on:
  workflow_dispatch:
    inputs:
      funcao:
        description: 'Nome da pasta em supabase/functions (ex.: ana-agua)'
        type: string
        required: true
      coletar:
        description: 'Depois de instalar, rodar a coleta (modo coletar)'
        type: boolean
        default: false
      corpo:
        description: 'JSON do corpo da coleta (ex.: {"modo":"coletar","limiteReservatorios":3})'
        type: string
        default: '{"modo":"coletar"}'
permissions:
  contents: read
concurrency:
  group: instituto-funcao
  cancel-in-progress: false
env:
  SUPABASE_REF: hlraekzvgxdpiiigdxdo
jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o nome e a chave
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCAO: ${{ inputs.funcao }}
        run: |
          case "$FUNCAO" in
            *[!a-z0-9-]*|'') echo "::error::Nome inválido: só letras minúsculas, números e hífen."; exit 1;;
          esac
          if [ ! -f "supabase/functions/$FUNCAO/index.ts" ]; then
            echo "::error::supabase/functions/$FUNCAO/index.ts não existe neste repositório."; exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta cadastrar SUPABASE_ACCESS_TOKEN em Settings → Secrets and variables → Actions."; exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Testes da função (nada sobe se algum teste falhar)
        env:
          FUNCAO: ${{ inputs.funcao }}
        run: |
          npx tsc --noEmit -p .
          if [ -f "supabase/functions/$FUNCAO/index.test.ts" ]; then
            npx vitest run "supabase/functions/$FUNCAO"
          else
            echo "::warning::A função não tem teste próprio; rodando a suíte inteira."
            npx vitest run
          fi

      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Instalar a função
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCAO: ${{ inputs.funcao }}
        run: supabase functions deploy "$FUNCAO" --project-ref "$SUPABASE_REF" --use-api

      # O segredo do agendador é lido aqui e sai como variável mascarada: não vai para o registro,
      # nem para o chat, nem para o navegador.
      - name: Rodar a coleta
        if: ${{ inputs.coletar }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCAO: ${{ inputs.funcao }}
          CORPO: ${{ inputs.corpo }}
          # Chave pública (a mesma que o navegador já recebe); a segurança está nas regras do banco
          # e no segredo do agendador, que vai no cabeçalho x-cron-secret.
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhscmFla3p2Z3hkcGlpaWdkeGRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODEzOTksImV4cCI6MjEwODQ1NzM5OX0.yCNPEGDb7tdf1JIY30WKUbE-xZwjQFwygJFJnvBeyrs
        run: |
          jq -n '{query: "select cron_segredo from public.configuracoes limit 1"}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/q.json -o /tmp/seg.json
          SEGREDO=$(jq -r '.[0].cron_segredo // empty' /tmp/seg.json)
          if [ -z "$SEGREDO" ]; then echo "::error::Não achei o segredo do agendador em configuracoes."; exit 1; fi
          echo "::add-mask::$SEGREDO"
          codigo=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST \
            "https://$SUPABASE_REF.supabase.co/functions/v1/$FUNCAO" \
            -H "Authorization: Bearer $ANON" -H "apikey: $ANON" \
            -H "x-cron-secret: $SEGREDO" -H 'Content-Type: application/json' \
            --data "$CORPO")
          echo "Resposta ($codigo):"
          cat /tmp/r.json
          echo
          { echo "### Coleta de $FUNCAO"; echo '```json'; cat /tmp/r.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$codigo" -ge 300 ]; then exit 1; fi
